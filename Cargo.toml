[package]
name = "git-pin"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Pin Git repositories to the native desktop launcher"
repository = "https://github.com/example/git-pin"

[lib]
name = "git_pin"
path = "src/lib.rs"

[[bin]]
name = "git-pin"
path = "src/bin/git-pin.rs"

[[bin]]
name = "git-unpin"
path = "src/bin/git-unpin.rs"

[[bin]]
name = "git-pin-launcher"
path = "src/bin/git-pin-launcher.rs"
required-features = ["macos-launcher"]

[features]
default = []
macos-launcher = []

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
